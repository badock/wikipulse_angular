# Host nginx: /etc/nginx/sites-available/spiral.jonathanpastor.fr (then symlink into sites-enabled)
# Short URL -> visible redirect to the Traefik-served app.
# Requires: DNS A record spiral.jonathanpastor.fr -> 51.178.27.27 (replacing the GitLab Pages CNAME),
# and the *.apps.jonathanpastor.fr block from the mandelbrot repo (deploy/nginx/apps.jonathanpastor.fr.conf).
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spiral.jonathanpastor.fr;

    # Existing *.jonathanpastor.fr cert: check the real path with `sudo certbot certificates`
    ssl_certificate     /etc/letsencrypt/live/api.golisp.jonathanpastor.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.golisp.jonathanpastor.fr/privkey.pem;

    return 301 https://spiral.apps.jonathanpastor.fr$request_uri;
}
