# Build the image, push it to the GitLab registry, then create/update the Portainer stack.
#
# Required CI/CD variables (Settings > CI/CD > Variables, masked + protected):
#   PORTAINER_URL        e.g. https://51.178.27.27:9443
#   PORTAINER_TOKEN      Portainer access token
#   PORTAINER_ENDPOINT_ID  (optional, default 3)

stages:
  - build
  - deploy

build:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  variables:
    # Talk to the dind service over plain TCP (no TLS certs to share between containers).
    # The runner must run with `privileged = true` for dind to start.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  image: alpine:3.22
  before_script:
    - apk add --no-cache curl jq
  script:
    - IMAGE_TAG="$CI_COMMIT_SHORT_SHA" sh deploy/portainer-deploy.sh spiral deploy/spiral/docker-compose.yml
  environment:
    name: production
    url: https://spiral.apps.jonathanpastor.fr
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
